name: Deploy Business

on:
  push:
    branches: [main]
    paths:
      - 'business/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-business.yml'
  workflow_dispatch:

concurrency:
  group: deploy-business
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: business/package-lock.json

      - name: Install
        working-directory: business
        run: npm ci

      - name: Build
        working-directory: business
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APIPAYVN }}
          projectId: apipayvn
          target: business
          channelId: live
