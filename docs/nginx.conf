# ===========================================================================
# ApiPay Pay - Production Nginx Configuration
# Optimized for high-traffic SPA serving (millions of requests)
# Security hardened | DDoS mitigated | Performance tuned
# ===========================================================================
# This file is included inside the http {} context by the default
# nginx Docker image's /etc/nginx/nginx.conf via:
#   include /etc/nginx/conf.d/*.conf;
# So http-level directives (limit_req_zone, map, etc.) are valid here.
# ===========================================================================

# ---------------------------------------------------------------------------
# RATE LIMITING ZONES
# ---------------------------------------------------------------------------
# General page requests — 30 req/s per IP with burst tolerance
limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;

# Static assets — more lenient (browsers open many parallel connections)
limit_req_zone $binary_remote_addr zone=static:20m rate=100r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=perip:20m;

# Standard rate limit response
limit_req_status 429;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# BOT DETECTION MAP
# ---------------------------------------------------------------------------
map $http_user_agent $is_bad_bot {
    default 0;
    ~*(nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan) 1;
}

server {
    listen 80;
    server_name _;

    # Root points to the Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # ===================================================================
    # SECURITY: Hide server info
    # ===================================================================
    server_tokens off;

    # ===================================================================
    # SECURITY HEADERS (applied globally)
    # ===================================================================
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;" always;

    # ===================================================================
    # PERFORMANCE: GZIP COMPRESSION
    # ===================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2
        font/ttf;

    # ===================================================================
    # ANTI-DDoS: Connection & timeout limits
    # ===================================================================
    # Max concurrent connections per IP
    limit_conn perip 50;

    # Limit request body size (landing page = no uploads)
    client_max_body_size 1m;

    # Prevent slowloris attacks
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    keepalive_timeout     30s;
    keepalive_requests    200;

    # Buffer limits — prevent buffer overflow attacks but allow reasonable header sizes
    client_body_buffer_size    16k;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;

    # ===================================================================
    # BLOCK MALICIOUS BOTS (vulnerability scanners)
    # ===================================================================
    if ($is_bad_bot) {
        return 444;
    }

    # ===================================================================
    # DENY NON-SAFE HTTP METHODS
    # ===================================================================
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # ===================================================================
    # STATIC ASSETS — Vite content-hashed files (immutable cache)
    # /assets/index-0akkxZdT.css, /assets/index-zBEgHeqK.js, etc.
    # ===================================================================
    location /assets/ {
        limit_req zone=static burst=60 nodelay;

        # Cache for 1 year — safe because Vite changes the hash on rebuild
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Serve pre-compressed .gz/.br files if available
        gzip_static on;

        # Don't log static asset requests (reduce I/O)
        access_log off;
    }

    # ===================================================================
    # FAVICON & APP ICONS — moderate cache
    # ===================================================================
    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-icon.*\.png|android-icon.*\.png|ms-icon.*\.png|browserconfig\.xml|manifest\.json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ===================================================================
    # ROBOTS & SITEMAP
    # ===================================================================
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        try_files $uri =404;
    }

    # ===================================================================
    # BLOCK EXPLOIT PATHS — common attack vectors
    # ===================================================================
    # Hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # WordPress, PHP, admin panels — drop connection instantly
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|administrator|phpmyadmin|cgi-bin|xmlrpc\.php|license\.txt|readme\.html|\.env|\.git) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # Backup / source / config files — never serve
    location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp|tar|gz|zip|env|orig|save|old|DS_Store)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 444;
    }

    # ===================================================================
    # SPA FALLBACK — ★ THIS FIXES YOUR 404 ON /about ★
    # All non-file routes fallback to index.html for React Router
    # ===================================================================
    location / {
        limit_req zone=general burst=20 nodelay;

        # Try file → directory → SPA fallback
        try_files $uri $uri/ /index.html;
    }

    # ===================================================================
    # INDEX.HTML — never cache (ensures instant deploys)
    # ===================================================================
    location = /index.html {
        internal;
        add_header Cache-Control   "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma          "no-cache" always;
        add_header Expires         "0" always;

        # Re-apply security headers (nginx replaces parent add_header in children)
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;" always;
    }

    # ===================================================================
    # CUSTOM ERROR HANDLING
    # ===================================================================
    # 404s also fallback to the SPA (React Router handles its own 404 page)
    error_page 404 /index.html;
}
